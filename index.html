<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>箱アイドル2048 | GameForge PJ</title>
<style>
  html, body { margin:0; padding:0; background:#17141f; height:100%; }
  body { display:flex; justify-content:center; align-items:flex-start; font-family: system-ui, "Hiragino Kaku Gothic ProN", sans-serif; }
  #wrap { position:relative; width:390px; height:640px; overflow:hidden; }
  canvas { display:block; width:390px; height:640px; touch-action:none; }
  .overlay {
    position:absolute; inset:0; display:none; flex-direction:column;
    justify-content:center; align-items:center; gap:16px;
    background:rgba(16,12,24,.78); color:#fff; text-align:center; z-index:5;
  }
  .overlay.show { display:flex; }
  .overlay h2 { margin:0; font-size:34px; letter-spacing:.05em; }
  .overlay p { margin:0; opacity:.85; }
  .overlay button {
    font-size:17px; padding:12px 28px; border-radius:999px; border:0;
    background:#ffb84d; color:#241a08; font-weight:700; cursor:pointer;
  }
  .overlay button.sub { background:#3a334d; color:#eee; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="390" height="640"></canvas>
  <div class="overlay" id="winOverlay">
    <h2>伝説のワンマン達成!</h2>
    <p>動員2048に到達しました。このまま続けることもできます。</p>
    <button id="continueBtn">つづける</button>
    <button class="sub" id="winRestartBtn">さいしょから</button>
  </div>
  <div class="overlay" id="overOverlay">
    <h2>ゲームオーバー</h2>
    <p id="finalScore"></p>
    <button id="overRestartBtn">もういちど</button>
  </div>
</div>
<script>
"use strict";
/* GameForge PJ - 2048 core logic (pure, no DOM). Original implementation.
   Works in the browser (window.GF2048) and in Node (module.exports)
   so the same code is unit-testable. */
(function (root, factory) {
  const api = factory();
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.GF2048 = api;
})(typeof self !== "undefined" ? self : globalThis, function () {
  const SIZE = 4;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function emptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function emptyCells(board) {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) if (board[r][c] === 0) cells.push([r, c]);
    return cells;
  }

  function spawnRandom(board, rng) {
    const cells = emptyCells(board);
    if (!cells.length) return null;
    const [r, c] = cells[Math.floor(rng() * cells.length)];
    const value = rng() < 0.9 ? 2 : 4;
    board[r][c] = value;
    return { row: r, col: c, value };
  }

  /* Slide one line toward index 0, merging equal neighbours once.
     Returns { line, gained }. */
  function slideLine(line) {
    const vals = line.filter((v) => v !== 0);
    const out = [];
    let gained = 0;
    for (let i = 0; i < vals.length; i++) {
      if (i + 1 < vals.length && vals[i] === vals[i + 1]) {
        const merged = vals[i] * 2;
        out.push(merged);
        gained += merged;
        i++;
      } else {
        out.push(vals[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { line: out, gained };
  }

  function lineCoords(dir, i) {
    // coordinates of line i (row or column) in slide order for dir
    const coords = [];
    for (let k = 0; k < SIZE; k++) {
      if (dir === "left") coords.push([i, k]);
      else if (dir === "right") coords.push([i, SIZE - 1 - k]);
      else if (dir === "up") coords.push([k, i]);
      else coords.push([SIZE - 1 - k, i]); // down
    }
    return coords;
  }

  function move(board, dir) {
    const next = emptyBoard();
    let gained = 0;
    for (let i = 0; i < SIZE; i++) {
      const coords = lineCoords(dir, i);
      const line = coords.map(([r, c]) => board[r][c]);
      const { line: slid, gained: g } = slideLine(line);
      gained += g;
      coords.forEach(([r, c], k) => { next[r][c] = slid[k]; });
    }
    const moved = JSON.stringify(next) !== JSON.stringify(board);
    return { board: next, gained, moved };
  }

  /* Like move(), but also reports per-tile animation events:
     { type: "slide"|"merge"|"stay", value, to:[r,c], sources:[[r,c],...] }.
     A merge has two sources: sources[0] survives visually, sources[1]
     slides into the same cell and disappears. */
  function moveTracked(board, dir) {
    const next = emptyBoard();
    let gained = 0;
    const events = [];
    for (let i = 0; i < SIZE; i++) {
      const coords = lineCoords(dir, i);
      const entries = [];
      coords.forEach(([r, c]) => {
        if (board[r][c]) entries.push({ v: board[r][c], from: [r, c] });
      });
      let out = 0;
      for (let k = 0; k < entries.length; k++) {
        const to = coords[out];
        if (k + 1 < entries.length && entries[k].v === entries[k + 1].v) {
          const merged = entries[k].v * 2;
          next[to[0]][to[1]] = merged;
          gained += merged;
          events.push({ type: "merge", value: merged, to, sources: [entries[k].from, entries[k + 1].from] });
          k++;
        } else {
          next[to[0]][to[1]] = entries[k].v;
          const same = entries[k].from[0] === to[0] && entries[k].from[1] === to[1];
          events.push({ type: same ? "stay" : "slide", value: entries[k].v, to, sources: [entries[k].from] });
        }
        out++;
      }
    }
    const moved = JSON.stringify(next) !== JSON.stringify(board);
    return { board: next, gained, moved, events };
  }

  function canMove(board) {
    if (emptyCells(board).length) return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return true;
        if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return true;
      }
    return false;
  }

  function maxTile(board) {
    return Math.max(...board.flat());
  }

  return { SIZE, mulberry32, emptyBoard, emptyCells, spawnRandom, slideLine, move, moveTracked, canMove, maxTile };
});

</script>

<script>
"use strict";
/* GameForge PJ - 2048 renderer/input with slide animation.
   Game state (board/score/win/lose) updates immediately on a move via
   logic.moveTracked; the animation layer only interpolates tile
   positions for display. Tiles are character sprites
   (assets/tiles/tile_<value>.png) with a number badge; if a sprite is
   missing, a colored tile is drawn instead so the game always runs. */
(function () {
  const L = window.GF2048;
  const W = 390, H = 640;
  const BOARD_X = 15, BOARD_Y = 168, BOARD = 360, GAP = 10;
  const CELL = (BOARD - GAP * (L.SIZE + 1)) / L.SIZE;
  const VALUES = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048];
  const TILE_COLORS = {
    2: "#ffd6e8", 4: "#ffb3d1", 8: "#a8e6ff", 16: "#b8f1cc",
    32: "#ffe29a", 64: "#ffb38a", 128: "#ff8fa3", 256: "#c39bff",
    512: "#f7a8ff", 1024: "#fff3b0", 2048: "#ffe45e",
  };
  // Rank shown in the header, keyed by the current max tile (= crowd size).
  const RANKS = {
    2: ["駆け出し", "小さな箱で悪戦苦闘中"],
    4: ["小箱の常連", "イツメン募集中"],
    8: ["常連がついた", "サイリウムが少し増えた"],
    16: ["小箱の星", "小箱では動員トップアイドル"],
    32: ["中箱デビュー", "ワンマンも始めたが招待客多め"],
    64: ["中箱の人気者", "かなりチヤホヤされてる"],
    128: ["大箱進出", "フロアが埋まってきた"],
    256: ["大箱満員", "熱気がすごい"],
    512: ["真のワンマン", "真のワンマンライブが打てる"],
    1024: ["ホール級", "地下の夢の到達点"],
    2048: ["伝説", "伝説のワンマン達成"],
  };
  const SLIDE_MS = 115;   // tile travel time
  const POP_MS = 110;     // merge/spawn pop time after arrival
  const TOTAL_MS = SLIDE_MS + POP_MS;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const params = new URLSearchParams(location.search);
  const seed = params.has("seed") ? parseInt(params.get("seed"), 10) : (Date.now() % 2147483647);
  const rng = L.mulberry32(seed);

  const bg = new Image();
  bg.src = (window.__DATA_URLS__ || {})["bg"] || "assets/bg.png";
  const sprites = {};
  VALUES.forEach((v) => {
    const img = new Image();
    img.src = (window.__DATA_URLS__ || {})[v] || `assets/tiles/tile_${v}.png`;
    sprites[v] = img;
  });
  // Redraw as soon as each image finishes loading. Without this, the
  // first frame can be drawn before the (data-URL) images decode and
  // the player sees a plain board until their first move.
  function requestRender() {
    if (typeof board !== "undefined" && board) render(performance.now(), anim);
  }
  const portraits = {};
  VALUES.forEach((v) => {
    const pimg = new Image();
    pimg.src = (window.__DATA_URLS__ || {})["p" + v] || `assets/portraits/portrait_${v}.png`;
    portraits[v] = pimg;
  });
  bg.onload = requestRender;
  VALUES.forEach((v) => { sprites[v].onload = requestRender; portraits[v].onload = requestRender; });
  window.addEventListener("load", requestRender);
  setTimeout(requestRender, 500);

  let board, score, best, state, wonShown;
  let anim = null;        // { start, events, spawn, preBoard }
  let bufferedDir = null; // latest input received during an animation
  best = parseInt(localStorage.getItem("gameforge_2048_best") || "0", 10);

  const cellX = (c) => BOARD_X + GAP + c * (CELL + GAP);
  const cellY = (r) => BOARD_Y + GAP + r * (CELL + GAP);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  function hideOverlays() {
    document.getElementById("winOverlay").classList.remove("show");
    document.getElementById("overOverlay").classList.remove("show");
  }

  function restart() {
    anim = null;
    bufferedDir = null;
    board = L.emptyBoard();
    score = 0;
    state = "playing";
    wonShown = false;
    const s1 = L.spawnRandom(board, rng);
    const s2 = L.spawnRandom(board, rng);
    hideOverlays();
    // opening tiles pop in
    anim = { start: performance.now(), events: [], spawn: s1, spawn2: s2, preBoard: L.emptyBoard(), opening: true };
    requestAnimationFrame(tick);
  }

  function doMove(dir) {
    if (state !== "playing" && state !== "won") return false;
    if (anim && !anim.opening) { bufferedDir = dir; return true; }
    const res = L.moveTracked(board, dir);
    if (!res.moved) return false;
    const preBoard = board;
    board = res.board;
    score += res.gained;
    if (score > best) {
      best = score;
      localStorage.setItem("gameforge_2048_best", String(best));
    }
    const s = L.spawnRandom(board, rng);
    if (!wonShown && L.maxTile(board) >= 2048) {
      wonShown = true;
      state = "won";
      document.getElementById("winOverlay").classList.add("show");
    } else if (!L.canMove(board)) {
      state = "gameover";
      document.getElementById("finalScore").textContent = "総動員数: " + score;
      document.getElementById("overOverlay").classList.add("show");
    }
    anim = { start: performance.now(), events: res.events, spawn: s, preBoard };
    requestAnimationFrame(tick);
    return true;
  }

  function tick(now) {
    if (!anim) { render(now, null); return; }
    render(now, anim);
    if (now - anim.start < TOTAL_MS) {
      requestAnimationFrame(tick);
    } else {
      anim = null;
      render(now, null);
      if (bufferedDir) {
        const d = bufferedDir;
        bufferedDir = null;
        doMove(d);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  }

  function drawTileAt(v, px, py, scale, highlight) {
    const pad = (CELL * (1 - scale)) / 2;
    const x = px + pad;
    const y = py + pad;
    const s = CELL - pad * 2;
    const img = sprites[v];
    if (img && img.complete && img.naturalWidth) {
      // scene tiles are full-bleed photos: clip to the cell's rounded shape
      ctx.save();
      roundRect(x, y, s, s, 10);
      ctx.clip();
      ctx.drawImage(img, x, y, s, s);
      ctx.restore();
    } else {
      ctx.fillStyle = TILE_COLORS[v] || "#666";
      roundRect(x, y, s, s, 10);
      ctx.fill();
    }
    if (highlight) {
      ctx.save();
      ctx.shadowColor = "rgba(255, 213, 79, .95)";
      ctx.shadowBlur = 16;
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#ffd54f";
      roundRect(x + 2, y + 2, s - 4, s - 4, 9);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(255, 255, 255, .92)";
      roundRect(x + 5, y + 5, s - 10, s - 10, 7);
      ctx.stroke();
      ctx.restore();
    }
    const label = String(v);
    ctx.font = "700 " + (label.length > 3 ? 13 : 15) + "px system-ui, sans-serif";
    const tw = ctx.measureText(label).width + 12;
    ctx.fillStyle = "rgba(10,8,16,.78)";
    roundRect(px + CELL - tw - 4, py + CELL - 22, tw, 18, 9);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(label, px + CELL - tw + 2, py + CELL - 8);
  }

  function render(now, a) {
    ctx.clearRect(0, 0, W, H);
    if (bg.complete && bg.naturalWidth) ctx.drawImage(bg, 0, 0, W, H);
    else { ctx.fillStyle = "#241d33"; ctx.fillRect(0, 0, W, H); }

    ctx.fillStyle = "rgba(12,9,20,.55)";
    ctx.fillRect(0, 0, W, 150);
    const rankV = Math.max(2, L.maxTile(board));
    const rank = RANKS[rankV] || RANKS[2];
    ctx.fillStyle = "#fff";
    ctx.font = "700 26px system-ui, sans-serif";
    ctx.fillText("箱アイドル2048", 18, 37);
    ctx.font = "500 12px system-ui, sans-serif";
    ctx.fillStyle = "#ffd9ec";
    ctx.fillText("合体させて動員を増やそう", 18, 59);
    ctx.font = "700 18px system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("総動員数 " + score, 18, 87);
    ctx.font = "500 13px system-ui, sans-serif";
    ctx.fillStyle = "#cfc6e8";
    ctx.fillText("ベスト " + best, 196, 87);
    ctx.font = "700 16px system-ui, sans-serif";
    ctx.fillStyle = "#ff9ecb";
    ctx.fillText(rank[0], 18, 113);
    ctx.font = "500 12.5px system-ui, sans-serif";
    ctx.fillStyle = "#e8dff5";
    ctx.fillText(rank[1], 18, 133);
    ctx.font = "500 11px system-ui, sans-serif";
    ctx.fillStyle = "#9d92b8";
    ctx.fillText("矢印キー / WASD / スワイプ", 18, 148);
    // rank portrait (idol only) in a stage-like frame
    ctx.fillStyle = "rgba(30,16,44,.85)";
    roundRect(296, 8, 86, 134, 10);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,158,203,.5)";
    ctx.stroke();
    const pimg = portraits[rankV];
    if (pimg && pimg.complete && pimg.naturalWidth) {
      ctx.drawImage(pimg, 301, 34, 76, 76);
    } else if (sprites[rankV] && sprites[rankV].complete && sprites[rankV].naturalWidth) {
      ctx.drawImage(sprites[rankV], 301, 34, 76, 76);
    }
    ctx.font = "700 12px system-ui, sans-serif";
    ctx.fillStyle = "#ffd9ec";
    ctx.textAlign = "center";
    ctx.fillText("動員 " + rankV, 339, 126);
    ctx.textAlign = "left";

    ctx.fillStyle = "rgba(20,15,30,.72)";
    roundRect(BOARD_X - 5, BOARD_Y - 5, BOARD + 10, BOARD + 10, 14);
    ctx.fill();
    for (let r = 0; r < L.SIZE; r++)
      for (let c = 0; c < L.SIZE; c++) {
        ctx.fillStyle = "rgba(255,255,255,.13)";
        roundRect(cellX(c), cellY(r), CELL, CELL, 10);
        ctx.fill();
      }

    const maxV = L.maxTile(board);
    const highlightValue = maxV >= 4 ? maxV : 0;

    if (!a) {
      for (let r = 0; r < L.SIZE; r++)
        for (let c = 0; c < L.SIZE; c++)
          if (board[r][c]) drawTileAt(board[r][c], cellX(c), cellY(r), 1, board[r][c] === highlightValue);
      return;
    }

    const t = Math.min(1, (now - a.start) / SLIDE_MS);
    const e = easeOut(t);
    const popT = Math.max(0, Math.min(1, (now - a.start - SLIDE_MS) / POP_MS));
    const mergedCells = new Set();

    // settled tiles first
    a.events.forEach((ev) => {
      if (ev.type === "stay") drawTileAt(ev.value, cellX(ev.to[1]), cellY(ev.to[0]), 1, ev.value === highlightValue);
      if (ev.type === "merge") mergedCells.add(ev.to[0] + "," + ev.to[1]);
    });
    // sliding tiles (sources carry their pre-move value)
    a.events.forEach((ev) => {
      if (ev.type === "stay") return;
      const highlight = ev.type === "slide" && ev.value === highlightValue;
      ev.sources.forEach(([sr, sc]) => {
        const v = a.preBoard[sr][sc];
        const x = cellX(sc) + (cellX(ev.to[1]) - cellX(sc)) * e;
        const y = cellY(sr) + (cellY(ev.to[0]) - cellY(sr)) * e;
        drawTileAt(v, x, y, 1, highlight);
      });
    });
    // merged results pop in after arrival
    if (popT > 0) {
      a.events.forEach((ev) => {
        if (ev.type !== "merge") return;
        const scale = 1.18 - 0.18 * popT;
        drawTileAt(ev.value, cellX(ev.to[1]), cellY(ev.to[0]), scale, ev.value === highlightValue);
      });
      [a.spawn, a.spawn2].forEach((s) => {
        if (!s) return;
        const scale = 0.6 + 0.4 * popT;
        drawTileAt(s.value, cellX(s.col), cellY(s.row), scale, s.value === highlightValue);
      });
    }
  }

  const KEYMAP = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
  };
  window.addEventListener("keydown", (e) => {
    const dir = KEYMAP[e.key];
    if (dir) { e.preventDefault(); doMove(dir); }
  });

  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    touchStart = [e.touches[0].clientX, e.touches[0].clientY];
  }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart[0];
    const dy = e.changedTouches[0].clientY - touchStart[1];
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  }, { passive: true });

  document.getElementById("continueBtn").addEventListener("click", () => {
    state = "playing";
    hideOverlays();
    render(performance.now(), null);
  });
  document.getElementById("winRestartBtn").addEventListener("click", restart);
  document.getElementById("overRestartBtn").addEventListener("click", restart);

  window.__GAME__ = {
    get board() { return board; },
    get score() { return score; },
    get state() { return state; },
    get rankValue() { return Math.max(2, L.maxTile(board)); },
    get highlightValue() { const m = L.maxTile(board); return m >= 4 ? m : 0; },
    highlightCells() {
      const m = L.maxTile(board);
      if (m < 4) return [];
      const cells = [];
      for (let r = 0; r < L.SIZE; r++)
        for (let c = 0; c < L.SIZE; c++) if (board[r][c] === m) cells.push([r, c]);
      return cells;
    },
    move: doMove,
    restart,
    setBoard(b, s) {
      anim = null;
      bufferedDir = null;
      board = b.map((row) => row.slice());
      if (typeof s === "number") score = s;
      state = "playing";
      hideOverlays();
      render(performance.now(), null);
    },
  };

  restart();
  window.__GAME_READY__ = true;
})();

</script>
</body>
</html>
